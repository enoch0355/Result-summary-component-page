<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='styles.css'>
    <title>Results summary component</title>
  </head>
  <body>
    <div>
      <div class='div-1'>
      <p>Your Result</p>
      <div>
        <h1>76</h1>
        <p>of 100</p>
      </div>
        <h4>Great</h4>
        <p>You scord higher than 65% of the people who have taken these tests.</p>
      </div>
      <!--second section -->
      <div>
        <h3>Summary</h3>
        <div class='colth c0'>
          <div class='red'>
          <img>
          <p>Reaction</p>
          </div>
          <p><span>80</span> / 100</p>
        </div>
        <div class='colth c1'>
          <div class='orange'>
          <img>
          <p>Memory</p>
          </div>
          <p><span>92</span> / 100</p>
        </div>
        <div class='colth c2'>
          <div class='green'>
          <img>
          <p>Verbal</p>
          </div>
          <p><span>61</span> / 100</p>
        </div>
        <div class='colth c3'>
          <div class='blue'>
          <img>
          <p>Visual</p>
          </div>
          <p><span>73</span> / 100</p>
        </div>
        <button>Continue</button>
      </div>
    </div>
  </body>
</html>
